dest root /
dest ram /tmp
lists_dir ext /var/opkg-lists
option overlay_root /overlay

# Always-available packages shipped inside the firmware. This is a normal
# opkg source and can be edited, disabled or removed from LuCI like any other.
src/gz sbe_local file:///usr/share/sbe-feed

# Additional sources are stored in /etc/opkg/*.conf and managed from LuCI.
arch all 100
arch noarch 200
arch aarch64_generic 300
arch aarch64_cortex-a73_neon-vfpv4 400
